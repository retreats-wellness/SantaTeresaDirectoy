<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Teresa Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Barlow',sans-serif;
  background:#fff;
  color:#0a0a0a;
}

h1,h2{
  font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;
  letter-spacing:.05em;
}

/* HERO */
.hero{
  height:80vh;
  display:flex;
  align-items:flex-end;
  padding:3rem;
  background:#000;
  color:#fff;
}

.hero h1{
  font-size:4rem;
}

/* EXPLORE GRID */
.explore{
  padding:4rem 2rem;
}

.explore-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.2rem;
  max-width:800px;
  margin:auto;
}

.explore-card{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #ddd;
  font-family:'Barlow Condensed';
  font-weight:700;
  letter-spacing:.1em;
  cursor:pointer;
  transition:.2s;
}

.explore-card:hover{
  border-color:#c9a84c;
  transform:translateY(-4px);
}

/* SECTIONS */
.cat{
  display:none;
  padding:3rem 2rem;
}

.cat h2{
  margin-bottom:1.5rem;
}

/* GRID ITEMS */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:1rem;
}

.card{
  border:1px solid #eee;
  padding:1rem;
  transition:.2s;
}

.card:hover{
  border-color:#c9a84c;
}

.card-title{
  font-family:'Barlow Condensed';
  font-weight:600;
}

/* BACK BUTTON */
.back{
  margin-bottom:2rem;
  display:inline-block;
  cursor:pointer;
  font-size:.8rem;
  letter-spacing:.1em;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Santa Teresa</h1>
</section>

<!-- EXPLORE -->
<section class="explore">
  <div class="explore-grid">

    <div class="explore-card" data-target="surf">Surf</div>
    <div class="explore-card" data-target="eat">Food</div>
    <div class="explore-card" data-target="wellness">Wellness</div>
    <div class="explore-card" data-target="tours">Adventures</div>
    <div class="explore-card" data-target="learn">Learn</div>
    <div class="explore-card" data-target="community">Community</div>

  </div>
</section>

<!-- SURF -->
<section class="cat" id="surf">
  <div class="back" onclick="goBack()">← Back</div>
  <h2>Surf</h2>
  <div class="grid">
    <div class="card"><div class="card-title">Surf Lessons</div></div>
    <div class="card"><div class="card-title">Surf Camps</div></div>
    <div class="card"><div class="card-title">Board Rental</div></div>
    <div class="card"><div class="card-title">Advanced Surf</div></div>
  </div>
</section>

<!-- FOOD -->
<section class="cat" id="eat">
  <div class="back" onclick="goBack()">← Back</div>
  <h2>Food</h2>
  <div class="grid">
    <div class="card"><div class="card-title">Beachfront</div></div>
    <div class="card"><div class="card-title">Cafes</div></div>
    <div class="card"><div class="card-title">Local Spots</div></div>
    <div class="card"><div class="card-title">Nightlife</div></div>
  </div>
</section>

<!-- WELLNESS -->
<section class="cat" id="wellness">
  <div class="back" onclick="goBack()">← Back</div>
  <h2>Wellness</h2>
  <div class="grid">
    <div class="card"><div class="card-title">Yoga</div></div>
    <div class="card"><div class="card-title">Massage</div></div>
    <div class="card"><div class="card-title">Retreats</div></div>
    <div class="card"><div class="card-title">Fitness</div></div>
  </div>
</section>

<!-- TOURS -->
<section class="cat" id="tours">
  <div class="back" onclick="goBack()">← Back</div>
  <h2>Adventures</h2>
  <div class="grid">
    <div class="card"><div class="card-title">Tortuga Island</div></div>
    <div class="card"><div class="card-title">ATV</div></div>
    <div class="card"><div class="card-title">Waterfalls</div></div>
    <div class="card"><div class="card-title">Zipline</div></div>
  </div>
</section>

<!-- JS -->
<script>
const cards = document.querySelectorAll('.explore-card');
const sections = document.querySelectorAll('.cat');
const explore = document.querySelector('.explore');

cards.forEach(card=>{
  card.onclick = () => {
    explore.style.display = 'none';
    sections.forEach(s=>s.style.display='none');
    document.getElementById(card.dataset.target).style.display='block';
  }
});

function goBack(){
  sections.forEach(s=>s.style.display='none');
  explore.style.display='block';
}
</script>

</body>
</html>
